name: Cinema Surround Player - Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Installer Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Télécharger FFmpeg précompilé
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $root = Get-ChildItem $destination -Directory | Select-Object -First 1
          if (-not $root -or -not (Test-Path (Join-Path $root.FullName "include/libavformat/avformat.h"))) {
            throw "Archive FFmpeg invalide : en-têtes libavformat introuvables."
          }
          "FFMPEG_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FFmpeg prêt : $($root.FullName)"

      - name: Configurer
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DFFMPEG_ROOT="$env:FFMPEG_ROOT" `
            -DFFMPEG_INCLUDE_DIR="$env:FFMPEG_ROOT/include"

      - name: Compiler
        run: cmake --build build --config Release --parallel 2

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Préparer le paquet Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/CinemaSurroundPlayer.exe package/
          windeployqt --release --no-translations package/CinemaSurroundPlayer.exe
          Get-ChildItem "$env:FFMPEG_ROOT/bin/*.dll" | Copy-Item -Destination package/
          Compress-Archive -Path package/* -DestinationPath CinemaSurroundPlayer-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CinemaSurroundPlayer-Windows-x64
          path: CinemaSurroundPlayer-Windows-x64.zip

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CinemaSurroundPlayer-Windows-x64.zip
